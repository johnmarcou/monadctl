services:

  validator-1:
    container_name: validator-1
    build: .
    privileged: true
    ports:
      - 8080:8080
      - 8081:8080
    environment:
      VAL_ID: 1
      TOTAL_VALIDATOR_NUMBER: 3
    volumes:
      - shared-data:/shared

  validator-2:
    container_name: validator-2
    build: .
    privileged: true
    ports:
      - 8082:8080
    environment:
      VAL_ID: 2
      TOTAL_VALIDATOR_NUMBER: 3
    volumes:
      - shared-data:/shared

  validator-3:
    container_name: validator-3
    build: .
    privileged: true
    ports:
      - 8083:8080
    environment:
      VAL_ID: 3
      TOTAL_VALIDATOR_NUMBER: 3
    volumes:
      - shared-data:/shared

volumes:
  shared-data:
